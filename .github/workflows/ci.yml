name: Installed wheel
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          bash tools/build-antlr-wheel.sh wheelhouse
          python -m pip download --find-links wheelhouse --require-hashes --only-binary=:all: -r requirements.lock -d wheelhouse
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.lock
          python -m pip wheel --no-build-isolation --no-index --no-deps -w dist .
          python -m pip install --no-index --no-deps dist/*.whl
          python -m pip check
      - run: |
          cd "$RUNNER_TEMP"
          expected="$(seq -s, 0 259)"
          actual="$(grid-protection-robustness eusipco remaining --run "$RUNNER_TEMP/empty-run" --array)"
          test "$actual" = "$expected"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"
